name: Docker & E2E Selenium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Start Docker Compose Environment
        run: |
          docker compose up -d --build

      - name: Wait for WebUI and Services Health
        run: |
          echo "Waiting for WebUI (http://localhost:8080) to be ready..."
          timeout=180
          while [ $timeout -gt 0 ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true)
            if [ "$status" -eq 200 ]; then
              echo "WebUI is up and running!"
              docker compose ps
              break
            fi
            echo "Waiting for WebUI... (status: $status, remaining time: ${timeout}s)"
            sleep 5
            timeout=$((timeout - 5))
          done
          if [ $timeout -le 0 ]; then
            echo "Timed out waiting for WebUI to become ready."
            docker compose ps
            docker compose logs
            exit 1
          fi

      - name: Run Selenium UI Tests
        env:
          TARGET_URL: "http://localhost:8080"
        run: |
          dotnet test tests/WebUI.SeleniumTests/WebUI.SeleniumTests.csproj --logger "console;verbosity=detailed"

      - name: Container Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Teardown Docker Environment
        if: always()
        run: |
          docker compose down
